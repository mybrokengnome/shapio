name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build all packages (including the admin bundle)
        run: pnpm build

  integration:
    name: Integration (Node ${{ matrix.node }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shapio_ci
      # Media on S3 suite (apps/api/test/mediaS3.int.test.ts) runs against versitygw; fail rather than skip.
      S3_TEST_ENDPOINT: http://127.0.0.1:7070
      S3_TEST_ACCESS_KEY: shapio-test
      S3_TEST_SECRET_KEY: shapio-test-secret
      S3_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the PostgreSQL ${{ matrix.postgres }} client (pg_dump must match the server)
        run: |
          sudo apt-get update
          # ubuntu-latest ships the PGDG apt repo; add it if a future image drops it.
          if ! apt-cache show "postgresql-client-${{ matrix.postgres }}" > /dev/null 2>&1; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          fi
          sudo apt-get install -y "postgresql-client-${{ matrix.postgres }}"
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - name: Start versitygw (S3-compatible gateway, Apache-2.0)
        run: |
          mkdir -p /tmp/s3
          docker run -d --name s3 -p 127.0.0.1:7070:7070 -v /tmp/s3:/data \
            -e ROOT_ACCESS_KEY="$S3_TEST_ACCESS_KEY" -e ROOT_SECRET_KEY="$S3_TEST_SECRET_KEY" \
            versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --port :7070 --quiet posix /data
          for i in $(seq 1 30); do
            # Any HTTP status means it is up (anonymous requests get 403).
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$S3_TEST_ENDPOINT")" != 000 ] && exit 0
            sleep 1
          done
          docker logs s3
          exit 1
      - run: pnpm test:integration
      - if: failure()
        run: docker logs s3 || true
      # kysely-ctl loads the server config, whose NODE_ENV defaults to production (PUBLIC_URL required).
      - name: Generated database types match the migrations
        env:
          NODE_ENV: test
          PUBLIC_URL: http://localhost:4300
        run: |
          psql "$TEST_DATABASE_URL" -c 'create database shapio_ci'
          pnpm db:migrate
          pnpm db:codegen
          git diff --exit-code -- apps/api/src/db/types.ts
      - name: Every migration rolls back
        env:
          NODE_ENV: test
          PUBLIC_URL: http://localhost:4300
        run: |
          pnpm db:rollback
          pnpm db:migrate

  integration-sqlite:
    name: Integration (Node 24, SQLite)
    runs-on: ubuntu-latest
    env:
      # Each test file gets a copy of a migrated template file in a temporary directory.
      TEST_DATABASE_URL: 'sqlite:'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - name: The SQLite migrations roll back
        env:
          NODE_ENV: test
          PUBLIC_URL: http://localhost:4300
          DATABASE_URL: sqlite:/tmp/shapio-ci.db
        run: |
          pnpm db:migrate
          pnpm db:rollback
          pnpm db:migrate

  integration-mysql:
    name: Integration (Node 24, MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent" --health-interval 5s
          --health-timeout 5s --health-retries 30
      # The MySQL baseline is compared with the PostgreSQL migrations (test/mysqlBaseline.int.test.ts).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Each test file gets a database cloned from a migrated template on this server.
      TEST_DATABASE_URL: mysql://root:mysql@127.0.0.1:3306/
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - name: The MySQL migrations roll back
        env:
          NODE_ENV: test
          PUBLIC_URL: http://localhost:4300
          DATABASE_URL: mysql://root:mysql@127.0.0.1:3306/shapio_ci
        run: |
          mysql -h 127.0.0.1 -uroot -pmysql -e 'create database shapio_ci character set utf8mb4 collate utf8mb4_0900_bin'
          pnpm db:migrate
          pnpm db:rollback
          pnpm db:migrate

  npm-package:
    name: npm package smoke test (npx shapio start, create-shapio)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the workspace packages (a fresh clone has no dist/)
        run: pnpm build
      - run: pnpm smoke:npm

  examples:
    name: Site starters (seed a local Shapio once; build and smoke Astro, Next.js over HTTP and in process, Next.js drafts mode, SvelteKit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shapio_example
      PUBLIC_URL: http://localhost:4300
      MEDIA_PATH: /tmp/shapio-media
      LOG_LEVEL: warn
      SHAPIO_URL: http://localhost:4300
      SHAPIO_ADMIN_EMAIL: ci@example.com
      SHAPIO_ADMIN_PASSWORD: example-site-ci-password
      ASTRO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build @shapio/client, @shapio/visual and @shapio/local (the starters use their builds, as a project installed from npm does)
        run: pnpm --filter "@shapio/client..." --filter "@shapio/visual" --filter "@shapio/local" build
      - name: Start Shapio from source
        working-directory: apps/api
        # Only Shapio runs in development mode; the starters build for production.
        env:
          NODE_ENV: development
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'create database shapio_example'
          node --conditions=@shapio/source --import tsx src/cli.ts migrate
          node --conditions=@shapio/source --import tsx src/cli.ts admin create --email "$SHAPIO_ADMIN_EMAIL"
          nohup node --conditions=@shapio/source --import tsx src/main.ts > /tmp/shapio.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:4300/api/ready && exit 0; sleep 1; done
          cat /tmp/shapio.log
          exit 1
      - name: Seed once (models, content, a delivery token); every starter reads the same .env
        run: |
          pnpm --filter example-astro seed
          cp examples/astro/.env examples/next/.env
          cp examples/astro/.env examples/sveltekit/.env
      - name: Astro (build, check the output and preview, then over HTTP)
        run: |
          pnpm --filter example-astro build
          pnpm --filter example-astro smoke
          nohup pnpm --filter example-astro preview > /tmp/astro.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:4321/en/ && break; sleep 1; done
          pnpm --filter example-astro smoke:http
      - name: Next.js reading over HTTP (build, next start, smoke and the signed revalidation route)
        env:
          # The site and the smoke share it; the smoke signs a test event like Shapio's webhook does.
          SHAPIO_WEBHOOK_SECRET: ci-revalidate-secret
          SHAPIO_MODE: http
        run: |
          pnpm --filter example-next build
          nohup pnpm --filter example-next start > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/en/ && break; sleep 1; done
          pnpm --filter example-next smoke --revalidate --save /tmp/next-pages-http
          pkill -f 'next start'
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000/en/ || break; sleep 1; done
      - name: Next.js reading in process (@shapio/local on DATABASE_URL; the same smoke, then the same pages)
        env:
          SHAPIO_WEBHOOK_SECRET: ci-revalidate-secret
          SHAPIO_MODE: in-process
        run: |
          pnpm --filter example-next build
          nohup pnpm --filter example-next start > /tmp/next-in-process.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/en/ && break; sleep 1; done
          pnpm --filter example-next smoke --revalidate --save /tmp/next-pages-in-process
          # Rendered markup (scripts and build asset links aside), public media URLs included, must not differ.
          diff -r /tmp/next-pages-http /tmp/next-pages-in-process
          pkill -f 'next start'
      - name: Next.js drafts mode (next dev with SHAPIO_DRAFTS=true and the seed's dev token; a saved draft shows on reload)
        env:
          SHAPIO_DRAFTS: 'true'
          SHAPIO_MODE: http
        run: |
          nohup pnpm --filter example-next dev > /tmp/next-drafts.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://localhost:3000/en/ && break; sleep 1; done
          pnpm --filter example-next smoke:drafts
          pkill -f 'next dev'
      - name: SvelteKit (build, vite preview, smoke over HTTP)
        run: |
          pnpm --filter example-sveltekit build
          nohup pnpm --filter example-sveltekit preview > /tmp/sveltekit.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:4173/en/ && break; sleep 1; done
          pnpm --filter example-sveltekit smoke
      - name: Astro incremental build (restores unchanged pages; one published edit re-renders one page; last, as it publishes)
        run: pnpm --filter example-astro check:incremental
      - if: failure()
        run: cat /tmp/shapio.log /tmp/astro.log /tmp/next.log /tmp/next-in-process.log /tmp/next-drafts.log /tmp/sveltekit.log 2>/dev/null || true

  admin-e2e:
    name: Admin end to end on ${{ matrix.database }} (Playwright; axe and keyboard checks in light and dark)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: PostgreSQL
            test-database-url: postgres://postgres:postgres@localhost:5432/postgres
          - database: SQLite
            test-database-url: 'sqlite:'
          - database: MySQL
            test-database-url: mysql://root:mysql@127.0.0.1:3306/
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent" --health-interval 5s
          --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: ${{ matrix.test-database-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the workspace packages and the admin
        run: pnpm build
      - name: Install Chromium for Playwright
        working-directory: apps/admin
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the admin e2e suite
        working-directory: apps/admin
        run: pnpm e2e

  docker:
    name: Docker image and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every workspace manifest is copied before the frozen install
        run: node scripts/checkDockerfileManifests.mjs
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/mybrokengnome/shapio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: docker compose up passes /api/ready
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4300/api/ready; then echo; exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Container reports healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q shapio)")
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker compose logs shapio
          exit 1
      - if: always()
        run: docker compose down -v
